<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ダイノ・スマッシュ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<title>ダイノ・スマッシュ</title>
<style>
  html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; align-items: center; justify-content: center; position: fixed; width: 100%; }
  #game { display: block; background: #000; image-rendering: auto; touch-action: none; -webkit-user-drag: none; }
  #err { display: none; position: fixed; left: 20px; top: 20px; color: #ffb0a8; font: 16px/1.5 sans-serif; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<div id="err"></div>
<script>
  // play.cmd から開いたとき(?hb=1)だけ、ページが開いている間は 1 分おきにサーバへ合図を送る（遊んでいる途中で自動停止しないように）
  if (new URLSearchParams(location.search).get('hb') === '1') setInterval(() => { fetch('/__ping', { cache: 'no-store' }).catch(() => {}); }, 60000);
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
